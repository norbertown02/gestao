name: Fix products regions report

on:
  push:
    paths:
      - '.github/workflows/fix-products-regions-report.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply remaining commercial views
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/standardize-commercial-views.yml').read_text()
          marker='          # Produtos: base performance on valid sales orders and their order items.\n'
          start=source.find(marker)
          if start<0: raise SystemExit('Produtos marker not found')
          end=source.find('\n          print(\'Commercial views standardized successfully\')', start)
          if end<0: raise SystemExit('End marker not found')
          body=source[start:end]
          lines=[line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          helpers='''from pathlib import Path\nimport re\ndef read(path): return Path(path).read_text()\ndef write(path,text): Path(path).write_text(text)\ndef repl(text,old,new,label):\n    if old not in text: raise SystemExit(f"Pattern not found for {label}")\n    return text.replace(old,new)\ndef sub(text,pattern,replacement,label,flags=0):\n    new,n=re.subn(pattern,replacement,text,flags=flags)\n    if n==0: raise SystemExit(f"Regex not found for {label}")\n    return new\n'''
          exec(compile(helpers+'\n'+'\n'.join(lines),'commercial-views','exec'))
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/screens/Produtos.jsx src/screens/Regioes.jsx src/screens/RelatorioMensalFiltradoMulti.jsx
          if ! git diff --cached --quiet; then git commit -m 'fix: usar pedidos em produtos regioes e relatorio'; git push; fi