name: Fix mobile chart data

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-chart-data.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Corrigir serie de pedidos em Vendedores
        run: python3 .github/scripts/fix_mobile_chart_data.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/screens/Vendedores.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: usar serie de pedidos nos graficos de vendedores'
          git push origin main
