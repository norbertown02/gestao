name: Fix commercial PDF export

on:
  push:
    paths:
      - '.github/workflows/fix-commercial-pdf-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Aplicar correcao
        run: python .github/scripts/fix_pdf_export.py
      - name: Validar build
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/Fechamentos.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: destravar geracao do PDF comercial"
          git push origin main
