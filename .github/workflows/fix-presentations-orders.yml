name: Fix presentations orders
on:
  push:
    paths:
      - '.github/workflows/fix-presentations-orders.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch presentations engine
        run: python .github/scripts/fix_presentations_orders.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/screens/Fechamentos.jsx
          git commit -m "fix: usar pedidos nos slides comerciais" || exit 0
          git push
