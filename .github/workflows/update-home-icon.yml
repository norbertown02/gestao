name: Update home screen icon

on:
  push:
    paths:
      - '.github/workflows/update-home-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar exatamente o PNG aprovado no iPhone
        shell: bash
        run: |
          echo '' | base64 -d > public/favicon-180.png
          file public/favicon-180.png
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon-180.png
          git diff --cached --quiet && exit 0
          git commit -m "feat: aplicar exatamente o icone aprovado"
          git push origin main
