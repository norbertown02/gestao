name: Update home screen icon

on:
  push:
    paths:
      - '.github/workflows/update-home-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: pip install pillow

      - name: Gerar icone Nutrialle Gestao
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path
          import math

          S = 720
          img = Image.new('RGB', (S, S), '#050505')
          px = img.load()

          # Fundo preto premium com brilho laranja discreto no canto superior esquerdo.
          for y in range(S):
              for x in range(S):
                  dx, dy = x - 40, y - 25
                  d = math.sqrt(dx*dx + dy*dy)
                  glow = max(0.0, 1.0 - d / 430.0)
                  base = 5 + int(7 * (1 - y / S))
                  r = min(255, base + int(72 * glow))
                  g = min(255, base + int(28 * glow))
                  b = min(255, base + int(4 * glow))
                  px[x, y] = (r, g, b)

          draw = ImageDraw.Draw(img, 'RGBA')

          # Moldura arredondada e acabamento brilhante.
          draw.rounded_rectangle((18, 18, S-18, S-18), radius=110, outline=(255, 132, 24, 215), width=5)
          draw.rounded_rectangle((27, 27, S-27, S-27), radius=102, outline=(255, 255, 255, 42), width=2)
          draw.arc((-110, -140, 650, 430), 185, 300, fill=(255, 148, 36, 115), width=18)

          # Ondas inferiores no mesmo sentido visual do conceito aprovado.
          draw.arc((-250, 335, 1020, 820), 175, 345, fill=(255, 107, 0, 85), width=16)
          draw.arc((-100, 410, 1010, 835), 185, 345, fill=(255, 135, 15, 220), width=8)

          # Elementos de gestão bem discretos ao fundo.
          bars = [(112, 610, 155, 657), (169, 584, 214, 657), (228, 548, 275, 657), (290, 510, 339, 657)]
          for i, box in enumerate(bars):
              alpha = 22 + i * 6
              draw.rounded_rectangle(box, radius=10, fill=(255, 132, 24, alpha))
          draw.line([(105, 650), (172, 621), (236, 587), (305, 527)], fill=(255, 118, 8, 92), width=7)

          # Usa o logo OFICIAL que já está no projeto.
          logo = Image.open('src/assets/logo-nutrialle.png').convert('RGBA')
          target_w = 620
          target_h = round(logo.height * target_w / logo.width)
          logo = logo.resize((target_w, target_h), Image.Resampling.LANCZOS)
          # Pequena sombra para destacar sem alterar o logo.
          shadow = Image.new('RGBA', (S, S), (0,0,0,0))
          sh = Image.new('RGBA', logo.size, (0,0,0,0))
          sh_alpha = logo.getchannel('A').filter(ImageFilter.GaussianBlur(10))
          sh.putalpha(sh_alpha)
          shadow.alpha_composite(sh, ((S-target_w)//2 + 6, 240 + 8))
          img = Image.alpha_composite(img.convert('RGBA'), shadow)
          img.alpha_composite(logo, ((S-target_w)//2, 240))

          draw = ImageDraw.Draw(img, 'RGBA')

          # Linha laranja sob a marca.
          draw.rounded_rectangle((210, 482, 650, 491), radius=5, fill=(255, 118, 0, 255))

          # Título GESTÃO, centralizado e espaçado.
          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          font = ImageFont.truetype(font_path, 52)
          text = 'GESTÃO'
          spacing = 24
          widths = [draw.textlength(ch, font=font) for ch in text]
          total_w = sum(widths) + spacing * (len(text)-1)
          x = (S-total_w)/2
          y = 506
          # sombra sutil
          sx = x
          for ch, w in zip(text, widths):
              draw.text((sx+2, y+4), ch, font=font, fill=(0,0,0,180))
              sx += w + spacing
          tx = x
          for ch, w in zip(text, widths):
              draw.text((tx, y), ch, font=font, fill=(226,226,226,255), stroke_width=1, stroke_fill=(255,255,255,100))
              tx += w + spacing

          # Downsample para o tamanho recomendado pelo iPhone.
          out = img.convert('RGB').resize((180, 180), Image.Resampling.LANCZOS)
          out.save('public/favicon-180.png', optimize=True, compress_level=9)
          PY

      - name: Validar icone
        run: |
          python - <<'PY'
          from PIL import Image
          im = Image.open('public/favicon-180.png')
          assert im.size == (180, 180)
          print('icone OK:', im.size, im.mode)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon-180.png
          git diff --cached --quiet && exit 0
          git commit -m "feat: atualizar icone da tela inicial"
          git push origin main
