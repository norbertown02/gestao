name: Update home screen icon

on:
  push:
    paths:
      - '.github/workflows/update-home-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar exatamente o icone aprovado
        shell: bash
        run: |
          cat > /tmp/icon.b64 <<'EOF'
YnJmpVSyEfffTRAwcOZJlM1iBG1WGRsXPHjjPPOtNoUyultSqKVp7nw8Hg7rvv1kqRoHh6IhwFEbN59atfNbNly8UXX/zFm24yhqUUUQmlfWJzK6Wo
agXgvHPO2blrBxFpZQ4fOrTvwIF2Rva9RKDJPYXqjYxocAhCJiBpU7WyiUEqhBAUtXpThdruTFa0hiJWHh4EA0ezDDWGA/8wAYNY1jipjLVeb1NAqTG61Wr9
xV/8xcte9rLjx49bVO3evfuLX/jii178ImOMW3TU8DtYCqm1fvZ113384x/fv3+/XV7AzJ2xzg/94A996UtfElLGlDBfPFwQKaVO2L37wx/+yHnnn7e2tsZg
Nrxnz8k//dP/8U//9E9bRaG15mTIbDBSaf2yl738f7zznQsL8xMTk5OTE/PzC0WRz83PP/e658zNz+Ukw/4nnIiFLM/7g+ENN9zw2c9+9tixY899znPuu/9+
KYRtW2ojOTkrRFWpk0484YN/+VdPecqlq6urDM6k3LZt+5/88R///Ot/RjhPCAQmggCTR0YwRaVHRkbIyYhN6102DwvZH7/2xF94zolnTuKkMexoY0sLUzkm
MoxlaEu0JBWSMuH+Sf/P+Uj+nzVmiRLzJ3wrSEghhFuaI4UNLqaHW9XTarUAvPENb2DmK664ot3pdDodADt27LjgggsA5FmWXpJlmf2tVbQA/OAP/uDKyrLN
 
EOF
          tr -d '\n\r ' < /tmp/icon.b64 | base64 -d > public/favicon-180.png
          python - <<'PY'
          from PIL import Image
          im = Image.open('public/favicon-180.png')
          assert im.size == (180, 180), im.size
          print('icone aprovado aplicado:', im.size)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon-180.png
          git diff --cached --quiet && exit 0
          git commit -m "feat: aplicar exatamente o icone aprovado"
          git push origin main
