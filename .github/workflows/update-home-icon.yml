name: Update home screen icon

on:
  push:
    paths:
      - '.github/workflows/update-home-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Atualizar icone 180x180
        shell: bash
        run: |
          cat > /tmp/icon.b64 <<'EOF'
[...TRUNCATED_FOR_BREVITY...]
EOF
          base64 -d /tmp/icon.b64 > public/favicon-180.png
          file public/favicon-180.png
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon-180.png
          git diff --cached --quiet && exit 0
          git commit -m "feat: atualizar icone da tela inicial"
          git push origin main
